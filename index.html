<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天净沙·秋思 - 马致远</title>
    <style>
        /* 1. 设置整个页面的背景和排版 */
        body {
            /* 字体设置：确保中文字体优先，以获得更好的阅读体验 */
            font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; 
            margin: 0;
            padding: 0;
            height: 100vh; /* 视口高度 */
            display: flex; /* 启用 Flexbox 布局 */
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            text-align: center; /* 文本居中 */
            
            /* 2. 背景图片设置 */
            background-image: url('qiusi_background.jpg'); /* 请将 'qiusi_background.jpg' 替换为您实际的图片路径 */
            background-size: cover; /* 确保背景图片覆盖整个容器 */
            background-position: center; /* 确保背景图片居中 */
            background-repeat: no-repeat; /* 不重复平铺 */
            background-attachment: fixed; /* 背景图片固定，滚动时不会移动 */
        }

        /* 3. 诗歌内容容器样式 */
        .poem-container {
            background-color: rgba(0, 0, 0, 0.65); /* 黑色半透明背景，使文字更清晰 */
            padding: 40px 60px;
            border-radius: 10px; /* 圆角边框 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); /* 阴影效果 */
            max-width: 80%; /* 最大宽度限制 */
        }

        /* 4. 标题（诗名）样式 */
        .title {
            color: #f0e68c; /* 浅黄色 */
            font-size: 2.5em;
            margin-bottom: 15px;
            letter-spacing: 5px; /* 字间距 */
            border-bottom: 2px solid #f0e68c;
            padding-bottom: 10px;
        }

        /* 5. 作者样式 */
        .author {
            color: #cccccc; /* 浅灰色 */
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        /* 6. 诗句样式 */
        .stanza {
            color: #ffffff; /* 白色文字 */
            font-size: 1.8em;
            line-height: 1.8; /* 行高 */
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="poem-container">
        <h1 class="title">天净沙·秋思</h1>
        <p class="author">元 · 马致远</p>
        
        <div class="poem-text">
            <p class="stanza">枯藤老树昏鸦，</p>
            <p class="stanza">小桥流水人家，</p>
            <p class="stanza">古道西风瘦马。</p>
            <p class="stanza">夕阳西下，</p>
            <p class="stanza">断肠人在天涯。</p>
        </div>
    </div>

</body>
</html>
